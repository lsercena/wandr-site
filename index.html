<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5EFE0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=optional"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=optional"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /* Prevent font-swap reflow on LCP element — use fallback if font not cached */
      @font-face { font-family: 'Playfair Display'; font-display: optional; }
      @font-face { font-family: 'DM Sans'; font-display: optional; }
    </style>
    <title>Wandr — AI Travel Intelligence Platform</title>
    <meta
      name="description"
      content="Can you legally go there? What visa do you qualify for? Can you afford to live there? Wandr is your AI-powered travel intelligence platform."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
